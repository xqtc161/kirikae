image: nixos/nix

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"

stages:
  - build
  - test
  - lint

.zig: &zig
  before_script:
    - nix profile install nixpkgs#zig_0_17
    - nix profile install nixpkgs#ziglint

build:
  <<: *zig
  stage: build
  script:
    - zig build

test:
  <<: *zig
  stage: test
  script:
    - zig build test

lint:
  stage: lint
  allow_failure: true
  variables:
  script:
    - ziglint src/
